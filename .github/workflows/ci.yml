name: CI

on:
  push:
    branches:
      - '**'
  pull_request_target:
    branches:
      - '**'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/checkout@v7
      - name: Restore Dependency Cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-dependency-cache-${{ hashFiles('**/package.json') }}
      - run: npm install
      - run: npm run build
